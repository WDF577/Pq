name: realtime-dw

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: rtdw_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q 'Mode:'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [rtdw]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: rtdw_kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 3600000
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS:-3}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [rtdw]

  mysql:
    image: mysql:8.0
    container_name: rtdw_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-expire-logs-seconds=604800
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [rtdw]

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: rtdw_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep Ok"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [rtdw]

  clickhouse-loader:
    build:
      context: .
      dockerfile: docker/clickhouse-loader/Dockerfile
    container_name: rtdw_clickhouse_loader
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_LOADER_GROUP_ID: ${CLICKHOUSE_LOADER_GROUP_ID:-clickhouse_loader}
      CLICKHOUSE_LOADER_DLQ_TOPIC: ${CLICKHOUSE_LOADER_DLQ_TOPIC:-clickhouse_loader_dlq}
      CLICKHOUSE_LOADER_AUTO_OFFSET_RESET: ${CLICKHOUSE_LOADER_AUTO_OFFSET_RESET:-earliest}
      CLICKHOUSE_LOADER_IDLE_TIMEOUT: "0"
      CLICKHOUSE_LOADER_BATCH_SIZE: ${CLICKHOUSE_LOADER_BATCH_SIZE:-500}
      CLICKHOUSE_LOADER_FLUSH_INTERVAL: ${CLICKHOUSE_LOADER_FLUSH_INTERVAL:-2.0}
      CLICKHOUSE_LOADER_VERSION_EPOCH: ${CLICKHOUSE_LOADER_VERSION_EPOCH:-128}
      CLICKHOUSE_LOADER_METRICS_HOST: 0.0.0.0
      CLICKHOUSE_LOADER_METRICS_PORT: "9410"
    ports:
      - "${CLICKHOUSE_LOADER_METRICS_PORT:-9410}:9410"
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket, urllib.request; socket.create_connection(('kafka', 29092), 3).close(); urllib.request.urlopen('http://clickhouse:8123/ping', timeout=3).read(); urllib.request.urlopen('http://127.0.0.1:9410/healthz', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [rtdw]

  pipeline-freshness-exporter:
    build:
      context: .
      dockerfile: docker/freshness-exporter/Dockerfile
    container_name: rtdw_pipeline_freshness_exporter
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      PIPELINE_FRESHNESS_MONITOR_ENABLED: ${PIPELINE_FRESHNESS_MONITOR_ENABLED:-false}
      PIPELINE_BUSINESS_TIMEZONE: ${PIPELINE_BUSINESS_TIMEZONE:-Asia/Shanghai}
      PIPELINE_FRESHNESS_INTERVAL_SECONDS: ${PIPELINE_FRESHNESS_INTERVAL_SECONDS:-15}
      PIPELINE_FRESHNESS_STALE_AFTER_SECONDS: ${PIPELINE_FRESHNESS_STALE_AFTER_SECONDS:-300}
      PIPELINE_FRESHNESS_QUERY_TIMEOUT_SECONDS: ${PIPELINE_FRESHNESS_QUERY_TIMEOUT_SECONDS:-5}
      PIPELINE_FRESHNESS_METRICS_PORT: "9420"
    ports:
      - "${PIPELINE_FRESHNESS_METRICS_PORT:-9420}:9420"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9420/healthz', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [rtdw]

  flink-volume-init:
    image: busybox:1.36
    container_name: rtdw_flink_volume_init
    user: "0:0"
    command: ["sh", "-c", "chown -R 9999:9999 /opt/flink/checkpoints /opt/flink/savepoints"]
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints
    restart: "no"
    networks: [rtdw]

  flink-jobmanager:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    container_name: rtdw_flink_jobmanager
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
      flink-volume-init:
        condition: service_completed_successfully
    ports:
      - "${FLINK_UI_PORT:-8081}:8081"
      - "${FLINK_JM_METRICS_PORT:-9249}:9249"
    command: jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
    volumes:
      - ./config/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml:ro
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [rtdw]

  flink-taskmanager:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    container_name: rtdw_flink_taskmanager
    restart: unless-stopped
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      TASK_MANAGER_NUMBER_OF_TASK_SLOTS: ${FLINK_TASK_SLOTS:-16}
    ports:
      - "${FLINK_TM_METRICS_PORT:-9250}:9249"
    volumes:
      - ./config/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml:ro
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints
    networks: [rtdw]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: rtdw_kafka_exporter
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    command: ["--kafka.server=kafka:29092"]
    ports:
      - "${KAFKA_EXPORTER_PORT:-9308}:9308"
    networks: [rtdw]

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: rtdw_prometheus
    restart: unless-stopped
    depends_on:
      - flink-jobmanager
      - flink-taskmanager
      - kafka-exporter
      - clickhouse-loader
      - pipeline-freshness-exporter
      - alertmanager
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks: [rtdw]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: rtdw_alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks: [rtdw]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: rtdw_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [rtdw]

  spark-backfill:
    image: apache/spark:3.5.9-scala2.12-java17-python3-ubuntu
    profiles: ["batch"]
    depends_on:
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      MYSQL_JDBC_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ecommerce}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      MYSQL_USER: ${SPARK_MYSQL_USER:-spark_batch}
      MYSQL_PASSWORD: ${SPARK_MYSQL_PASSWORD:-spark_batch}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      BUSINESS_TIMEZONE: Asia/Shanghai
      SPARK_WAREHOUSE_ROOT: /opt/rtdw/warehouse
      SPARK_REPORT_PATH: /opt/rtdw/artifacts/spark_reconciliation_report.md
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - --master
      - local[2]
      - --driver-memory
      - ${SPARK_DRIVER_MEMORY:-1g}
      - --jars
      - /opt/spark/jars/mysql-connector-j-8.3.0.jar
      - --conf
      - spark.sql.shuffle.partitions=${SPARK_SHUFFLE_PARTITIONS:-4}
      - /opt/rtdw/spark-sql/run_order_daily_backfill.py
    volumes:
      - ./spark-sql:/opt/rtdw/spark-sql:ro
      - ./flink-lib/mysql-connector-j-8.3.0.jar:/opt/spark/jars/mysql-connector-j-8.3.0.jar:ro
      - ./data/spark-warehouse:/opt/rtdw/warehouse
      - ./artifacts:/opt/rtdw/artifacts
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [rtdw]

networks:
  rtdw:
    name: rtdw_network

volumes:
  mysql_data:
  clickhouse_data:
  flink_checkpoints:
  flink_savepoints:
  prometheus_data:
  grafana_data:
  alertmanager_data:
