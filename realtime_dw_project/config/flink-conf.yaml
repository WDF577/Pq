jobmanager.rpc.address: flink-jobmanager
jobmanager.memory.process.size: 1600m
taskmanager.memory.process.size: 3072m
taskmanager.numberOfTaskSlots: 16
parallelism.default: 1

# Checkpoints are the recovery boundary for operator state and Kafka offsets.
execution.checkpointing.interval: 10s
execution.checkpointing.mode: EXACTLY_ONCE
execution.checkpointing.min-pause: 5s
execution.checkpointing.timeout: 60s
execution.checkpointing.max-concurrent-checkpoints: 1
execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
state.backend.type: rocksdb
state.checkpoints.dir: file:///opt/flink/checkpoints
state.savepoints.dir: file:///opt/flink/savepoints

# A transient TaskManager failure should recover automatically instead of
# requiring a person to resubmit the SQL jobs.
restart-strategy.type: fixed-delay
restart-strategy.fixed-delay.attempts: 100
restart-strategy.fixed-delay.delay: 5s

# Expose Flink runtime metrics to Prometheus.
metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
metrics.reporter.prom.port: 9249
metrics.reporter.prom.filterLabelValueCharacters: true

rest.bind-address: 0.0.0.0
rest.address: flink-jobmanager
